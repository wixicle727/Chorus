<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chorus — Overlay</title>
<link rel="icon" href="/assets/chorus.ico" sizes="any" />
<!--
  OBS browser source page.

  Deliberately transparent: no background is painted anywhere, so OBS composites
  the lyrics over the scene. Implements the tosu-lyrics look — a three-line
  carousel (300px tall, one 100px slot per line) that translates so the active
  line sits in the middle, with the active line distinguished by font size only
  and a marquee that scrolls lines wider than the source.
-->
<style>
  :root {
    --line-height: 100px;
    --main-active-scale: 1.9;
    --main-idle-scale: 0.95;
    --sub-active-scale: 1.25;
    --sub-idle-scale: 0.64;
    --color-main: #ffffff;
    --color-sub: #e0e0e0;
    --color-active: #ffffff;
    /* Sung-text colour for the karaoke fill; the panel overrides it. */
    --color-karaoke: #4cc2ff;
    /* Width of the soft edge at the leading end of the fill. */
    --karaoke-feather: 0.12em;
    --shadow: 3px;
    --font-family: "Segoe UI", "Microsoft YaHei UI", "Meiryo", system-ui, sans-serif;
    --opacity-idle: 0.55;
    --gap: 10px;
    --align: center;
    --text-transform: none;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--font-family);
    /* Keep OBS from antialiasing text differently between GPU runs. */
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    display: block;
  }

  #viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #list {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    will-change: transform;
    transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .line {
    height: var(--line-height);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: var(--align-items, center);
    padding: 0 6px;
    user-select: none;
    overflow: hidden;
  }

  .main, .sub {
    margin: 0;
    padding: 0;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1.15;
    transition: font-size 300ms cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 300ms ease;
    /* Sized in em so the control panel's line-scale multiplies everything. */
    font-size: 1.5em;
    color: var(--color-main);
    text-transform: var(--text-transform);
  }

  .main {
    filter: drop-shadow(2px 2px var(--shadow) rgba(0, 0, 0, 0.95));
    opacity: var(--opacity-idle);
  }

  .sub {
    color: var(--color-sub);
    font-size: 1em;
    margin-top: 0.25em;
    filter: drop-shadow(2px 2px calc(var(--shadow) * 0.8) rgba(0, 0, 0, 0.95));
    display: none;
  }

  /* The active line: larger, brighter, and the only one showing its translation. */
  li.active .main {
    font-size: calc(1.5em * var(--main-active-scale) / 1.5);
    color: var(--color-active);
  }
  li.active .sub {
    display: block;
    font-size: calc(1em * var(--sub-active-scale));
  }

  li.idle .main {
    font-size: calc(1.5em * var(--main-idle-scale) / 1.5);
  }
  li.idle .sub { display: none; }

  li.lead .main { opacity: var(--opacity-idle); }

  /* ---------------------------------------------------------------------
     Karaoke fill.

     The sung part of the active line is a second copy of the text, masked from
     the left by --karaoke-progress. Two stacked copies of the same glyphs
     always line up exactly, which a gradient painted behind the text could not
     promise once the line is scaled, translated by the carousel, or scrolled by
     the marquee.

     The property is registered so the browser can interpolate it, and it
     inherits, because the mask lives on the copy while the value is written on
     the list item.
     --------------------------------------------------------------------- */
  @property --karaoke-progress {
    syntax: "<percentage>";
    inherits: true;
    initial-value: 0%;
  }

  .karaoke-stack { display: inline-grid; }
  .karaoke-stack > .main { grid-area: 1 / 1; }

  /*
     A mask only paints inside the element's box. These glyphs are taller than
     their line box — descenders and the drop shadow both hang below it — so the
     fill was being sliced off flat at the baseline and the sung half of the line
     lost its p, g and y tails.

     Padding grows the box past the ink; the equal negative margin gives the space
     back, so the item still occupies exactly its old place in the row and the two
     copies stay aligned with each other.
  */
  .karaoke-stack > .main {
    padding: 0.5em 0;
    margin: -0.5em 0;
  }

  li.karaoke .main.base { opacity: 1; }
  /*
     The unsung part of the line keeps the active colour: the blue sweep alone
     already reads as progress, and dimming the rest made the line being sung look
     fainter than the idle lines around it.
  */

  /* Specificity note: `li.active .main` sets the active colour, so the copy must
     out-specify it or the fill would be painted in the active colour and vanish.

     The copy is hidden with opacity rather than visibility. `visibility` is
     inherited but can be overridden by a child, so `visibility: visible` here
     defeated the "hide while paused" rule and left the blue text on screen when
     everything else had been blanked. Opacity applies to the whole subtree and
     cannot be undone by a descendant, so pausing hides the fill too. */
  /*
     No shadow of its own. The copy is painted directly on top of the base text,
     so the base's shadow already surrounds the blue glyphs; giving the copy a
     second drop shadow only darkened the overlap and made the sung half of the
     line look smudged next to the unsung half.
  */
  li.karaoke .main.karaoke-scan {
    color: var(--color-karaoke);
    opacity: 0;
    pointer-events: none;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  li.active.karaoke .karaoke-scan {
    opacity: 1;
    /*
       Clamp the feathered edge to whichever side is closer to an end. Without
       this, a progress of 0% or 100% would put the fade stops in the wrong
       order and the mask would eat a sliver of the finished text.
    */
    --karaoke-edge: min(
      var(--karaoke-feather),
      var(--karaoke-progress),
      calc(100% - var(--karaoke-progress))
    );
    -webkit-mask-image: linear-gradient(
      to right,
      #000 0,
      #000 calc(var(--karaoke-progress) - var(--karaoke-edge)),
      transparent calc(var(--karaoke-progress) + var(--karaoke-edge)),
      transparent 100%
    );
    mask-image: linear-gradient(
      to right,
      #000 0,
      #000 calc(var(--karaoke-progress) - var(--karaoke-edge)),
      transparent calc(var(--karaoke-progress) + var(--karaoke-edge)),
      transparent 100%
    );
  }

  /* Without mask support the fill still works, just with a hard edge. */
  @supports not ((mask-image: linear-gradient(to right, #000, transparent)) or
      (-webkit-mask-image: linear-gradient(to right, #000, transparent))) {
    li.active.karaoke .karaoke-scan {
      -webkit-mask-image: none;
      mask-image: none;
      clip-path: inset(0 calc(100% - var(--karaoke-progress)) 0 0);
    }
  }

  /* A tick every 50ms is visible as stepping at this size; let CSS close the gap. */
  li.karaoke.singing { transition: --karaoke-progress 90ms linear; }

  /* Marquee for lines wider than the source: scroll across during the line. */
  .track {
    display: inline-block;
    will-change: transform;
  }
  li.scrolling .track {
    animation: marquee var(--scroll-duration, 6s) linear infinite;
  }
  @keyframes marquee {
    0%   { transform: translateX(0); }
    12%  { transform: translateX(0); }
    88%  { transform: translateX(var(--scroll-distance, 0px)); }
    100% { transform: translateX(var(--scroll-distance, 0px)); }
  }

  /* Idle / no-lyrics plate. Hidden unless there is something to say. */
  #notice {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: var(--color-sub);
    font-size: 1.1em;
    font-weight: 600;
    opacity: 0.85;
  }
  #notice.show { display: flex; }
  #notice .title { font-size: 1.15em; color: var(--color-main); }
  #notice .hint { font-size: 0.62em; font-weight: 500; opacity: 0.7; margin-top: 0.5em; }

  /* Thin progress bar pinned to the bottom edge of the source. */
  #progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.16);
    display: none;
  }
  #progress.show { display: block; }
  #progress .bar {
    height: 100%;
    width: 0%;
    background: var(--color-active);
    opacity: 0.85;
    transition: width 400ms linear;
  }

  /* Shown only if the page is opened outside OBS, so a blank page is not confusing. */
  #debug {
    position: absolute;
    left: 8px;
    top: 6px;
    font-size: 11px;
    font-family: ui-monospace, Consolas, monospace;
    color: #ff9f43;
    background: rgba(0, 0, 0, 0.55);
    padding: 2px 6px;
    border-radius: 4px;
    display: none;
    white-space: pre;
    max-width: 90%;
  }
  body.show-debug #debug { display: block; }
</style>
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <ul id="list" aria-live="off"></ul>
    </div>
    <div id="notice"><div class="title"></div><div class="hint"></div></div>
    <div id="progress"><div class="bar"></div></div>
    <div id="debug"></div>
  </div>

  <script type="module">
    import { setLanguage, t, normaliseLanguage } from '/js/i18n.js';

    /**
     * Overlay runtime.
     *
     * The server sends the lyric document plus an anchor (position + playing +
     * wall clock). Between messages this page dead-reckons the position so lines
     * change exactly on time rather than on the next poll, then corrects itself
     * whenever a message arrives.
     */
    const params = new URLSearchParams(location.search);
    const WINDOW = Number(params.get('window') || 3);      // visible line slots
    const SHOW_DEBUG = params.get('debug') === '1';
    const SHOW_PROGRESS = params.get('progress') === '1';

    /*
       The overlay is a separate document from the panel, so it resolves the
       language itself. A `?lang=` parameter wins, which is how the panel's live
       preview shows the language before the setting is saved.
    */
    const LANG_PARAM = params.get('lang');
    fetch('/api/config')
      .then((response) => response.json())
      .then((config) => setLanguage(LANG_PARAM || normaliseLanguage(config?.app?.language)))
      .catch(() => {
        if (LANG_PARAM) setLanguage(LANG_PARAM);
      });

    const listEl = document.getElementById('list');
    const stageEl = document.getElementById('stage');
    const noticeEl = document.getElementById('notice');
    const noticeTitleEl = noticeEl.querySelector('.title');
    const noticeHintEl = noticeEl.querySelector('.hint');
    const progressEl = document.getElementById('progress');
    const progressBarEl = progressEl.querySelector('.bar');
    const debugEl = document.getElementById('debug');
    if (SHOW_DEBUG) document.body.classList.add('show-debug');

    let settings = {
      visibleLines: WINDOW,
      lineHeightPx: 100,
      lineScale: 1,
      activeMainScale: 1.9,
      inactiveMainScale: 0.95,
      activeSubScale: 1.25,
      inactiveSubScale: 0.64,
      alignment: 'center',
      showTranslation: true,
      translationAsMain: false,
      colorMain: '#ffffff',
      colorSub: '#e0e0e0',
      colorActive: '#ffffff',
      karaoke: false,
      karaokeColor: '#4cc2ff',
      shadow: 3,
      uppercase: false,
      idleOpacity: 0.55,
      leadInText: '',
      hideOnPause: false,
      hideWhenNoLyrics: false,
      showPlaceholder: true,
    };

    // Local mirror of the last server state.
    let lines = [];
    let timerAnchor = { positionMs: 0, at: performance.now(), playing: false };
    let renderSignature = '';
    let lastIndex = -2;
    let status = 'idle';
    let track = null;
    let offsetMs = 0;
    let sourceWidth = 0;
    let blankUntilNextTrack = false;
    /** The real line elements, cached so the per-tick fill needs no DOM query. */
    let lineEls = [];

    function currentPositionMs() {
      const elapsed = performance.now() - timerAnchor.at;
      return timerAnchor.playing ? timerAnchor.positionMs + elapsed : timerAnchor.positionMs;
    }

    /** Last line whose start time has passed; -1 before the first line. */
    function indexAt(positionMs) {
      if (!lines.length) return -1;
      const t = positionMs + offsetMs;
      if (t < lines[0].timeMs) return -1;
      let lo = 0;
      let hi = lines.length - 1;
      let answer = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (lines[mid].timeMs <= t) { answer = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      return answer;
    }

    /**
     * How far through the line at `index` a position is, as 0..1.
     *
     * Most lyric sources time whole lines and nothing finer, so the fill runs
     * evenly from one line's start to the next line's start. That is what a
     * karaoke track with no word timings does, and it is the honest reading of
     * the data: the sweep reaches the end of the line exactly as the next line
     * begins.
     *
     * Pure on purpose — the timing maths is the part worth testing, and it can
     * be exercised without a browser. Returns null when there is no line.
     */
    /**
     * The syllable stamps a line can actually be filled from, or null.
     *
     * Only sources that time every syllable provide these; the rest describe a
     * line with one stamp and nothing inside it. A single stamp is no better than
     * the constant sweep, so it is treated as absent — which is what keeps a
     * karaoke-less song looking exactly as it always did.
     */
    const MIN_TIMED_WORDS = 2;

    function usableWords(line) {
      const list = Array.isArray(line.words) ? line.words : null;
      if (!list || list.length < MIN_TIMED_WORDS) return null;
      const timed = list.filter((word) => Number.isFinite(Number(word.timeMs)));
      return timed.length >= MIN_TIMED_WORDS ? list : null;
    }

    function karaokeProgressAt(index, positionMs, allLines = lines, offset = offsetMs) {
      if (!Number.isInteger(index) || index < 0) return null;
      const line = allLines[index];
      if (!line) return null;

      const start = line.timeMs;
      const next = allLines[index + 1];
      let end = Number.isFinite(line.endMs) && line.endMs > start ? line.endMs : start + 4000;
      // A line that the document believes lasts past the next line's start would
      // otherwise keep filling while the following line is already being sung.
      if (next && next.timeMs > start && next.timeMs < end) end = next.timeMs;
      if (!(end > start)) return 0;

      const t = positionMs + offset;
      if (t <= start) return 0;
      if (t >= end) return 1;

      // A source that stamps every syllable (Qishui, NetEase YRC, Kugou KRC) knows
      // exactly when each one is sung, so the fill follows those stamps instead of
      // sweeping at a constant rate — which is only ever an average of how people
      // sing. Documents without usable syllable stamps fall through to the sweep.
      const words = usableWords(line);
      if (words) {
        const total = words.reduce((n, w) => n + Math.max(String(w.text ?? '').length, 1), 0);
        let sung = 0;
        for (let i = 0; i < words.length; i += 1) {
          const w = words[i];
          const at = Number(w.timeMs);
          if (!Number.isFinite(at)) continue;
          const until = Number.isFinite(w.endMs)
            ? w.endMs
            : i + 1 < words.length
              ? Number(words[i + 1].timeMs)
              : end;
          const chars = Math.max(String(w.text ?? '').length, 1);
          if (t >= until) {
            sung += chars;
            continue;
          }
          if (t > at) sung += until > at ? (chars * (t - at)) / (until - at) : chars;
          break;
        }
        return Math.min(1, sung / total);
      }

      return (t - start) / (end - start);
    }

    /**
     * Paint the fill on the active line.
     *
     * Runs on every tick rather than only when the line changes, because the
     * fill moves continuously. Pausing needs no special case: the dead-reckoned
     * position stops advancing, so the fill freezes with it.
     */
    function updateKaraoke(positionMs) {
      if (!settings.karaoke) return;
      const position = positionMs ?? currentPositionMs();
      const index = indexAt(position);
      const progress = karaokeProgressAt(index, position);

      for (const li of lineEls) {
        const i = Number(li.dataset.index);
        if (i === index && progress !== null) {
          li.classList.add('singing');
          li.style.setProperty('--karaoke-progress', `${(progress * 100).toFixed(2)}%`);
        } else {
          li.classList.remove('singing');
          li.style.removeProperty('--karaoke-progress');
        }
      }
    }

    function applySettings(next) {
      if (!next) return;
      settings = { ...settings, ...next };
      const root = document.documentElement.style;
      root.setProperty('--line-height', `${settings.lineHeightPx}px`);
      const base = Number(settings.lineScale) || 1;
      root.setProperty('--main-active-scale', String(Number(settings.activeMainScale) * base));
      root.setProperty('--main-idle-scale', String(Number(settings.inactiveMainScale) * base));
      root.setProperty('--sub-active-scale', String(Number(settings.activeSubScale) * base));
      root.setProperty('--sub-idle-scale', String(Number(settings.inactiveSubScale) * base));
      root.setProperty('--color-main', settings.colorMain);
      root.setProperty('--color-sub', settings.colorSub);
      root.setProperty('--color-active', settings.colorActive);
      root.setProperty('--color-karaoke', settings.karaokeColor || '#4cc2ff');
      root.setProperty('--shadow', `${settings.shadow}px`);
      root.setProperty('--font-family', settings.fontFamily || 'inherit');
      root.setProperty('--text-transform', settings.uppercase ? 'uppercase' : 'none');
      root.setProperty('--opacity-idle', String(Number(settings.idleOpacity ?? 0.55)));
      const alignMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
      root.setProperty('--align-items', alignMap[settings.alignment] ?? 'center');
      // Elements are laid out centre-out, so the transform maths stays identical
      // for every alignment; only the text anchoring changes.
      listEl.style.textAlign = settings.alignment ?? 'center';
    }

    /** Rebuild the line elements when the lyric document or settings change. */
    function buildLines() {
      listEl.innerHTML = '';
      lineEls = [];
      const fragment = document.createDocumentFragment();
      lines.forEach((line, index) => {
        const li = document.createElement('li');
        li.className = settings.karaoke ? 'line karaoke' : 'line';
        li.dataset.index = String(index);
        lineEls.push(li);

        const main = document.createElement('p');
        main.className = settings.karaoke ? 'main base' : 'main';
        const mainText = settings.translationAsMain && line.translation ? line.translation : line.text;
        main.textContent = mainText || (settings.showPlaceholder ? '♪' : '');

        const sub = document.createElement('p');
        sub.className = 'sub';
        if (settings.showTranslation && line.translation && !settings.translationAsMain) {
          sub.textContent = line.translation;
        } else if (settings.translationAsMain && line.translation) {
          sub.textContent = line.text;
        }

        // Wrap in a track span so the marquee can translate the text independently.
        const mainTrack = document.createElement('span');
        mainTrack.className = 'track';
        if (settings.karaoke) {
          /*
             Karaoke needs a second, identically-set copy of the same text on top
             of the first. It is aria-hidden because a screen reader would
             otherwise read every line twice.
          */
          const stack = document.createElement('span');
          stack.className = 'karaoke-stack';
          const scan = document.createElement('p');
          scan.className = 'main karaoke-scan';
          scan.setAttribute('aria-hidden', 'true');
          scan.textContent = main.textContent;
          stack.appendChild(main);
          stack.appendChild(scan);
          mainTrack.appendChild(stack);
        } else {
          mainTrack.appendChild(main);
        }
        li.appendChild(mainTrack);

        if (sub.textContent) {
          const subTrack = document.createElement('span');
          subTrack.className = 'track';
          subTrack.appendChild(sub);
          li.appendChild(subTrack);
        }

        fragment.appendChild(li);
      });
      listEl.appendChild(fragment);
      // One shared tall spacer at the end lets the last real line reach the centre.
      const spacer = document.createElement('li');
      spacer.className = 'line';
      spacer.setAttribute('aria-hidden', 'true');
      spacer.style.height = `${(Math.max(1, Math.floor((settings.visibleLines ?? 3) / 2)) + 1) * settings.lineHeightPx}px`;
      listEl.appendChild(spacer);
      measureScroll();
    }

    /**
     * Decide which lines are wider than the source and set up their marquee.
     * A line scrolls across once per line duration, which is how tosu-lyrics
     * times its `--time`.
     */
    function measureScroll() {
      sourceWidth = document.getElementById('viewport').clientWidth;
      const items = listEl.querySelectorAll('li.line');
      items.forEach((li) => {
        const index = Number(li.dataset.index);
        if (!Number.isFinite(index)) return;
        const tracks = li.querySelectorAll('.track');
        if (tracks.length === 0) return;
        let widest = 0;
        tracks.forEach((t) => { widest = Math.max(widest, t.scrollWidth); });
        const overflow = widest - sourceWidth + 24;
        if (overflow > 8) {
          li.classList.add('scrolling');
          li.style.setProperty('--scroll-distance', `${-overflow}px`);
          // Match the animation to the line's own duration, clamped to sane bounds.
          const line = lines[index];
          const duration = line ? Math.max(2000, Math.min(line.endMs - line.timeMs, 20000)) : 6000;
          li.style.setProperty('--scroll-duration', `${duration}ms`);
        } else {
          li.classList.remove('scrolling');
        }
      });
    }

    /** Position the list so the active line occupies the middle slot. */
    function render(force = false) {
      const index = indexAt(currentPositionMs());

      // "Hide text while paused" blanks the lyric lines. Visibility is computed
      // on every pass rather than only on a line change, otherwise pausing would
      // not blank the text until the next line boundary.
      const paused = !timerAnchor.playing && Boolean(track);

      /**
       * "Hide when there are no lyrics" renders nothing for a track that has none.
       *
       * The whole page is blanked rather than just the lines, because the notice plate
       * ("no lyrics found for this track") is itself something a streamer does not want on
       * screen. The overlay is a transparent OBS browser source, so hiding the stage is
       * enough — nothing else needs to be torn down.
       *
       * A search still in progress does NOT count as "no lyrics". Blanking then would flash
       * the overlay away and back on every track change, and would hide a perfectly good
       * result that was still being fetched.
       */
      const searchFinished = status === 'notfound' || status === 'instrumental';
      const noLyrics = searchFinished && lines.length === 0;
      const blanked = settings.hideWhenNoLyrics && noLyrics;

      const stageVisibility = blanked ? 'hidden' : 'visible';
      if (stageEl.style.visibility !== stageVisibility) stageEl.style.visibility = stageVisibility;

      const visibility = settings.hideOnPause && paused ? 'hidden' : 'visible';
      if (listEl.style.visibility !== visibility) listEl.style.visibility = visibility;

      if (index === lastIndex && !force) return;
      lastIndex = index;
      const lineHeight = settings.lineHeightPx;
      // Before the first line, show line 0 in the centre so the plate is filled.
      const effective = index < 0 ? 0 : index;
      const shift = effective * lineHeight;
      listEl.style.transform = `translateY(${-shift}px)`;

      const items = listEl.querySelectorAll('li.line');
      items.forEach((li) => {
        const i = Number(li.dataset.index);
        if (!Number.isFinite(i)) return;
        li.classList.toggle('active', i === index);
        li.classList.toggle('idle', i !== index);
        li.classList.toggle('lead', index < 0 && i === 0);
      });
    }

    function updateNotice() {
      const showPlate = lines.length === 0;
      noticeEl.classList.toggle('show', showPlate);
      if (!showPlate) return;

      if (status === 'searching') {
        noticeTitleEl.textContent = track ? track.title : t('Searching…');
        noticeHintEl.textContent = t('looking for lyrics');
      } else if (status === 'notfound') {
        noticeTitleEl.textContent = track ? track.title : t('No lyrics');
        // The fallback option can deliberately leave this blank until the next
        // song rather than showing a low-confidence match.
        noticeHintEl.textContent = blankUntilNextTrack
          ? t('no confident lyrics for this track')
          : t('no lyrics found for this track');
      } else if (status === 'instrumental') {
        noticeTitleEl.textContent = track ? track.title : t('Instrumental');
        noticeHintEl.textContent = '';
      } else if (status === 'bridge-down') {
        noticeTitleEl.textContent = t('Waiting for smtc-bridge');
        noticeHintEl.textContent = t('start SMTC-Bridge, then this fills in automatically');
      } else if (!track) {
        noticeTitleEl.textContent = t('Nothing playing');
        noticeHintEl.textContent = t('play something in your music app');
      } else {
        noticeTitleEl.textContent = track.title;
        noticeHintEl.textContent = t('loading lyrics…');
      }
    }

    function updateProgress(playback) {
      // The bar is opt-in via ?progress=1 from the OBS setup page.
      if (!SHOW_PROGRESS || !playback || !playback.durationMs) {
        progressEl.classList.remove('show');
        return;
      }
      progressEl.classList.add('show');
      const pct = Math.max(0, Math.min(100, (playback.positionMs / playback.durationMs) * 100));
      progressBarEl.style.width = `${pct}%`;
    }

    function updateDebug() {
      if (!SHOW_DEBUG) return;
      debugEl.textContent = [
        `ws ${socketState}`,
        `status ${status}`,
        `lines ${lines.length}`,
        `idx ${lastIndex}`,
        `kk ${settings.karaoke ? (lineEls[lastIndex]?.style.getPropertyValue('--karaoke-progress') || '0%') : 'off'}`,
        `pos ${(currentPositionMs() / 1000).toFixed(1)}s`,
        `off ${offsetMs}ms`,
        `ticks ${tickCount}`,
        track ? `${track.title} — ${track.artist}` : 'no track',
      ].join('\n');
    }

    /* ------------------------------ websocket ------------------------------ */

    let socketState = 'connecting';
    let socket = null;
    /** Closes a socket that has gone quiet, so a zombie connection cannot freeze the lyrics. */
    let watchdog = null;
    let lastMessageAt = 0;
    let reconnectTimer = null;

    function setSocketState(next) {
      socketState = next;
      updateDebug();
    }

    /**
     * A browser WebSocket can stop delivering data without ever firing `close` —
     * typically after the machine sleeps or the network changes. The socket looks
     * open, so nothing reconnects, and the overlay silently keeps showing stale
     * lyrics while the server carries on fine.
     *
     * The server sends a heartbeat far more often than this, so a long silence
     * means the connection is dead even though it claims otherwise.
     */
    const SILENCE_TIMEOUT_MS = 45000;

    function startWatchdog() {
      lastMessageAt = performance.now();
      clearInterval(watchdog);
      watchdog = setInterval(() => {
        if (!socket) return;
        if (socket.readyState !== 1) return; // already closing or closed
        if (performance.now() - lastMessageAt > SILENCE_TIMEOUT_MS) {
          setSocketState('stale');
          // Force the reconnect path by dropping the socket ourselves.
          try { socket.close(); } catch { /* already gone */ }
        }
      }, 5000);
    }

    function connect() {
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      try {
        socket = new WebSocket(`${protocol}//${location.host}/ws?role=overlay`);
      } catch (err) {
        setSocketState('error');
        reconnectTimer = setTimeout(connect, 1500);
        return;
      }
      setSocketState('connecting');
      startWatchdog();

      socket.onopen = () => {
        setSocketState('open');
        lastMessageAt = performance.now();
      };
      socket.onclose = () => {
        setSocketState('closed');
        clearInterval(watchdog);
        reconnectTimer = setTimeout(connect, 1500);
      };
      socket.onerror = () => setSocketState('error');
      socket.onmessage = (event) => {
        // Any traffic counts as liveness, including the server's heartbeat.
        lastMessageAt = performance.now();
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (message.type === 'hello') return;
        handleState(message);
      };
    }

    function handleState(message) {
      // Apply presentation settings first: buildLines() bakes them into the DOM.
      if (message.settings) applySettings(message.settings);

      const changedDocument = Boolean(message.lyrics?.lines);
      const signatureNeedsRebuild = buildNeeded();
      if (changedDocument) lines = message.lyrics.lines;

      status = message.lyrics?.status ?? message.status ?? 'idle';
      track = message.track ?? null;
      offsetMs = message.lyrics?.offsetMs ?? 0;
      blankUntilNextTrack = Boolean(message.lyrics?.blankUntilNextTrack);

      if (changedDocument || signatureNeedsRebuild) buildLines();

      // Re-anchor from the server's numbers so we cannot drift.
      if (message.playback) {
        timerAnchor = {
          positionMs: Number(message.playback.positionMs) || 0,
          at: performance.now(),
          playing: Boolean(message.playback.playing),
        };
      }

      updateNotice();
      updateProgress(message.playback);
      render(true);
      updateKaraoke();
      updateDebug();
    }

    let builtSettingsSignature = '';
    function buildNeeded() {
      const signature = [
        lines.length,
        settings.showTranslation,
        settings.translationAsMain,
        settings.uppercase,
        settings.showPlaceholder,
        settings.visibleLines,
        settings.karaoke,
      ].join('|');
      if (signature !== builtSettingsSignature) {
        builtSettingsSignature = signature;
        return true;
      }
      return false;
    }

    /* --------------------------------- loop --------------------------------- */

    /**
     * Timing loop.
     *
     * Deliberately a timer, NOT requestAnimationFrame. Chromium suspends rAF for
     * a page that is not actively rendering, which is exactly what an OBS browser
     * source becomes once the OBS window loses focus — the lyrics would freeze
     * until you clicked back into OBS. setInterval keeps firing in that state, so
     * the active line stays in sync no matter what has focus.
     *
     * Line-height changes are still smooth because the transform has a CSS
     * transition, and the marquee runs as a CSS animation on the compositor.
     */
    const TICK_MS = 50;
    let tickCount = 0;
    let lastTickWall = performance.now();

    function tick() {
      tickCount += 1;
      lastTickWall = performance.now();
      render(false);
      updateKaraoke();
      updateDebug();
    }

    // A single interval drives updates. `visibilitychange` and a slow safety
    // interval make sure we resync immediately after being backgrounded, and
    // recover if a browser ever does drop the main timer.
    const mainTimer = setInterval(tick, TICK_MS);
    const safetyTimer = setInterval(() => {
      // The main interval should have run many times since the last tick; if it
      // has not, it was throttled or dropped, so run one now.
      if (performance.now() - lastTickWall > TICK_MS * 4) tick();
    }, 1000);

    document.addEventListener('visibilitychange', () => {
      // Re-anchor nothing here: `timerAnchor` is wall-clock based and keeps
      // advancing on its own. A forced render snaps the carousel to the right
      // line the instant the source becomes visible again.
      render(true);
    });

    const resizeObserver = new ResizeObserver(() => {
      measureScroll();
      render(true);
    });
    resizeObserver.observe(document.getElementById('viewport'));

    applySettings(settings);
    buildLines();
    updateNotice();
    connect();
    tick();

    // Recolour the debug tag when the socket drops, so a broken OBS source is
    // obvious at a glance instead of silently showing stale lyrics.
    setInterval(() => {
      debugEl.style.color = socketState === 'open' ? '#4cd137' : '#ff9f43';
    }, 1000);

    // Exposed so the control panel / OBS "Refresh" can confirm the loop is live.
    window.__chorus = {
      ticks: () => tickCount,
      state: () => ({ socketState, status, lines: lines.length, lineIndex: lastIndex, tickCount }),
    };
  </script>
</body>
</html>
