<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chorus — Now Playing</title>
<link rel="icon" href="/assets/chorus.ico" sizes="any" />
<!--
  Universal "now playing" overlay: cover art, title, artist and a progress bar.

  Deliberately transparent like the lyrics overlay, so OBS composites the card over the
  scene. Modelled on nutty.gg's now-playing widget (the standard theme): the cover art is
  also blurred into the card background, which is what makes the card feel like it belongs
  to the artwork rather than sitting on top of it.

  Universal by construction: it reads whatever session Chorus has selected, so it follows
  the configured primary platform (Spotify, Apple Music, a browser, anything publishing a
  Windows media session) with no per-platform code.

  Independent of the lyrics overlay — either, both or neither can be added as a browser
  source. It asks the server for the now-playing slice with ?scope=now-playing, so the
  lyric document is never sent to it.
-->
<style>
  :root {
    --card-radius: 20px;
    --component-radius: 15px;
    --font-family: "Segoe UI", "Microsoft YaHei UI", "Meiryo", system-ui, sans-serif;
    --font-size: 20px;
    --align: left;
    --color-title: #ffffff;
    --color-artist: #e0e0e0;
    --color-progress: #ffffff;
    --color-accent: #4cc2ff;
    /* Set from the artwork when colour-from-cover is on. */
    --tint-light: rgba(28, 28, 33, 0.94);
    --tint-dark: rgba(16, 16, 19, 0.94);
    --accent-derived: var(--color-accent);
    --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    --track-bg: rgba(255, 255, 255, 0.22);
    --divider: rgba(255, 255, 255, 0.07);
    --show-cover: flex;
    --width: 500px;
    /*
     * Cover edge length, derived from the font size so the card scales as one piece.
     *
     * 4.6 keeps the whole card inside the ~140 px height of the documented OBS browser
     * source; a taller multiplier clipped the title and the progress bar.
     */
    --cover-size: calc(var(--font-size) * 4.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--font-family);
    -webkit-font-smoothing: antialiased;
  }

  /* Centres the card in whatever size the OBS browser source is. */
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /*
   * The whole widget is one rounded plate: cover on the left, text on the right, no gap.
   *
   * The children are clipped by this element (`overflow: hidden`), so their own corner radii
   * only need to match the outer edge — there is no seam between the two halves, and the
   * cover is exactly as tall as the card because both are stretched by the flex row.
   */
  #card {
    width: var(--width);
    max-width: 100%;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
    min-height: var(--cover-size);
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #card.ready { opacity: 1; }
  /* "Hide when nothing is playing" simply keeps the card transparent. */
  #card.hidden { opacity: 0; }

  /* ---------------------------------------------------------------- cover art */

  #cover {
    position: relative;
    width: var(--cover-size);
    flex: 0 0 auto;
    /* Fills the row's height, so it is never shorter than the text beside it. */
    align-self: stretch;
    /* Only the outer-left corners are rounded; the right edge meets the text panel. */
    border-radius: var(--card-radius) 0 0 var(--card-radius);
    overflow: hidden;
    display: var(--show-cover);
    background: #1b1b1f;
  }

  #cover-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /*
     * `contain`, not `cover`: artwork is usually square but not always, and `cover` cropped
     * the edges off. `contain` shows the whole image, letterboxed inside the square frame,
     * which stays rounded because the frame itself clips it.
     */
    object-fit: contain;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }

  /* A missing cover must not leave a broken-image glyph on screen. */
  #cover-img.empty { opacity: 0; }

  #pause-badge {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 2;
    /* A dimming veil rather than a filter on the artwork: brightness(0.45) on the cover
       made it look like no artwork was loaded at all. */
    background: rgba(0, 0, 0, 0.42);
  }
  #pause-badge svg {
    width: 34%;
    height: 34%;
    fill: rgba(255, 255, 255, 0.95);
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
  }
  #cover.paused #pause-badge { opacity: 1; }
  #cover.paused #cover-img { filter: brightness(0.82); }

  /* -------------------------------------------------------------------- info */

  #info {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.2em;
    /* Only the outer-right corners; the left edge meets the cover with a hairline, so the
       two halves read as one plate rather than two floating boxes. */
    border-radius: 0 var(--card-radius) var(--card-radius) 0;
    border-left: 1px solid var(--divider);
    overflow: hidden;
    padding: 0.7em 1em;
  }

  /* With the cover hidden the text panel carries the whole plate, so it regains its
     rounded left edge. */
  #card.no-cover #info { border-radius: var(--card-radius); border-left: 0; }

  /* The blurred artwork fills the card. Two layers so a track change cross-fades
     instead of flashing black. */
  #bg, #bg-next {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(12px) brightness(0.32) saturate(1.25);
    transform: scale(1.15);
    transition: opacity 0.5s ease;
  }
  #bg { z-index: 0; }
  #bg-next { z-index: 0; opacity: 0; }

  /* Without artwork the card still needs a readable surface. */
  #scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--tint-light), var(--tint-dark));
    z-index: 1;
  }

  /*
   * Two looks for the plate.
   *
   * `cover` — the artwork's most-used colour, laid down as a near-solid wash so it reads as
   *   a colour rather than a blur. The text colour is chosen for contrast against it.
   * `blur`  — the artwork itself, heavily blurred and darkened, showing through a light
   *   scrim. Softer, and always readable because the scrim does the work.
   */
  #card.style-cover #scrim {
    background: linear-gradient(135deg, var(--tint-light), var(--tint-dark));
    opacity: 0.94;
  }
  #card.style-cover #bg,
  #card.style-cover #bg-next { display: none; }

  #card.style-blur #bg,
  #card.style-blur #bg-next {
    filter: blur(14px) brightness(0.42) saturate(1.4);
    display: block;
  }
  #card.style-blur #scrim {
    background: linear-gradient(135deg, rgba(12, 12, 16, 0.34), rgba(8, 8, 11, 0.56));
    opacity: 1;
  }

  #content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    text-align: var(--align);
    min-width: 0;
  }

  .label {
    white-space: nowrap;
    overflow: hidden;
    /* Long titles scroll rather than being clipped with an ellipsis, and the
       animation is paused when the text already fits. */
    position: relative;
  }
  .label .inner {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
  }
  .label.scrolling .inner { animation: marquee var(--marquee-duration, 12s) linear infinite; }

  @keyframes marquee {
    0%, 8% { transform: translateX(0); }
    92%, 100% { transform: translateX(var(--marquee-shift, 0)); }
  }

  #title {
    font-size: 1.15em;
    font-weight: 600;
    color: var(--color-title);
    text-shadow: var(--text-shadow);
  }

  #artist {
    font-size: 0.85em;
    font-weight: 400;
    color: var(--color-artist);
    text-shadow: var(--text-shadow);
  }

  /* ---------------------------------------------------------------- progress */

  #progress {
    display: flex;
    align-items: center;
    gap: 0.6em;
    margin-top: 0.25em;
  }
  #progress.off { display: none; }

  .time {
    font-size: 0.7em;
    color: var(--color-progress);
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .time.off { display: none; }

  #track {
    position: relative;
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--track-bg);
    overflow: hidden;
  }

  #fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 3px;
    background: var(--color-accent);
    /* No transition on width: the bar is advanced by a timer every frame, and a
       transition would lag behind and look rubbery. */
  }

  #debug {
    position: absolute;
    left: 6px;
    bottom: 4px;
    z-index: 5;
    font-size: 11px;
    font-family: ui-monospace, Consolas, monospace;
    color: rgba(255, 255, 255, 0.75);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    display: none;
    pointer-events: none;
  }
  body.show-debug #debug { display: block; }
</style>
</head>
<body>

<div id="stage">
  <div id="card">
    <div id="cover">
      <img id="cover-img" class="empty" alt="" />
      <div id="pause-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
    </div>
    <div id="info">
      <div id="bg"></div>
      <div id="bg-next"></div>
      <div id="scrim"></div>
      <div id="content">
        <div class="label" id="title"><span class="inner">&nbsp;</span></div>
        <div class="label" id="artist"><span class="inner">&nbsp;</span></div>
        <div id="progress">
          <div class="time" id="elapsed">0:00</div>
          <div id="track"><div id="fill"></div></div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="debug"></div>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const bool = (name, fallback) => {
    if (!params.has(name)) return fallback;
    const v = params.get(name);
    return v === '1' || v === 'true' || v === 'yes';
  };
  const num = (name, fallback) => {
    const v = Number(params.get(name));
    return Number.isFinite(v) && v > 0 ? v : fallback;
  };
  const color = (name, fallback) => {
    const v = params.get(name);
    return v && /^#[0-9a-f]{3,8}$/i.test(v) ? v : fallback;
  };

  // URL overrides so a single OBS source can be tuned without touching config.json.
  const OVERRIDES = {};
  if (params.has('width')) OVERRIDES.widthPx = num('width', 500);
  if (params.has('fontSize')) OVERRIDES.fontSizePx = num('fontSize', 20);
  if (params.has('textAlign')) OVERRIDES.textAlign = params.get('textAlign');
  if (params.has('borderRadius')) OVERRIDES.borderRadiusPx = num('borderRadius', 20);
  // Which look the plate uses: the cover's own colour, or the blurred artwork.
  if (params.has('plateStyle')) OVERRIDES.plateStyle = params.get('plateStyle');
  for (const [key, name] of [
    ['showTitle', 'title'], ['showArtist', 'artist'], ['showProgress', 'progress'],
    ['showCover', 'cover'], ['showTimes', 'times'], ['showPausedState', 'paused'],
    ['hideWhenIdle', 'hideWhenIdle'], ['hideOnPause', 'hideOnPause'],
  ]) {
    if (params.has(name)) OVERRIDES[key] = bool(name, true);
  }
  for (const [key, name] of [
    ['colorTitle', 'colorTitle'], ['colorArtist', 'colorArtist'],
    ['colorProgress', 'colorProgress'], ['colorAccent', 'colorAccent'],
  ]) {
    if (params.has(name)) OVERRIDES[key] = color(name, '#ffffff');
  }

  const DEFAULTS = {
    showTitle: true, showArtist: true, showProgress: true, showCover: true,
    showTimes: true, showPausedState: true, hideOnPause: false, hideWhenIdle: true,
    /** 'cover' = the artwork's colour as a wash, 'blur' = the blurred artwork itself. */
    plateStyle: 'cover',
    widthPx: 500, fontSizePx: 18, textAlign: 'left', borderRadiusPx: 20,
    colorTitle: '#ffffff', colorArtist: '#e0e0e0', colorProgress: '#ffffff', colorAccent: '#4cc2ff',
  };

  const SHOW_DEBUG = bool('debug', false);

  const stageEl = document.getElementById('stage');
  const cardEl = document.getElementById('card');
  const coverEl = document.getElementById('cover');
  const coverImgEl = document.getElementById('cover-img');
  const bgEl = document.getElementById('bg');
  const bgNextEl = document.getElementById('bg-next');
  const titleEl = document.getElementById('title');
  const titleInnerEl = titleEl.querySelector('.inner');
  const artistEl = document.getElementById('artist');
  const artistInnerEl = artistEl.querySelector('.inner');
  const progressEl = document.getElementById('progress');
  const elapsedEl = document.getElementById('elapsed');
  const durationEl = document.getElementById('duration');
  const fillEl = document.getElementById('fill');
  const debugEl = document.getElementById('debug');

  if (SHOW_DEBUG) document.body.classList.add('show-debug');

  let settings = { ...DEFAULTS, ...OVERRIDES };
  let track = null;
  let playback = { playing: false, positionMs: 0, durationMs: 0, timelineAvailable: false };

  /** Local clock so the bar advances smoothly between the 500 ms server ticks. */
  let anchor = { positionMs: 0, at: performance.now(), playing: false };
  let currentCoverUrl = null;
  /** The decoded cover, kept so a style change can re-derive colours without reloading it. */
  let coverImage = null;

  function formatTime(ms) {
    if (!Number.isFinite(ms) || ms < 0) return '0:00';
    const total = Math.floor(ms / 1000);
    const minutes = Math.floor(total / 60);
    const seconds = total % 60;
    return `${minutes}:${String(seconds).padStart(2, '0')}`;
  }

  /** Where the playhead is now, allowing for the time since the last server tick. */
  function positionNow() {
    if (!anchor.playing) return anchor.positionMs;
    return anchor.positionMs + (performance.now() - anchor.at);
  }

  /**
   * Scroll a line only when it is wider than its box.
   *
   * A CSS animation on every line would slide short titles around for no reason, so the
   * overflow is measured and the animation applied only when it is needed.
   */
  function layoutLabel(el, innerEl, text) {
    if (innerEl.textContent !== text) innerEl.textContent = text;

    el.classList.remove('scrolling');
    innerEl.style.removeProperty('--marquee-shift');
    innerEl.style.removeProperty('--marquee-duration');

    const overflow = innerEl.scrollWidth - el.clientWidth;
    if (overflow <= 1) return;

    // Travel the overflow distance plus a little, then pause before repeating.
    innerEl.style.setProperty('--marquee-shift', `-${overflow + 24}px`);
    const duration = Math.max(6, (overflow + 24) / 28);
    innerEl.style.setProperty('--marquee-duration', `${duration}s`);
    el.classList.add('scrolling');
  }

  function applySettings() {
    const root = document.documentElement.style;
    root.setProperty('--width', `${settings.widthPx}px`);
    root.setProperty('--font-size', `${settings.fontSizePx}px`);
    root.setProperty('--card-radius', `${settings.borderRadiusPx}px`);
    root.setProperty('--component-radius', `${Math.round(settings.borderRadiusPx * 0.75)}px`);
    root.setProperty('--align', settings.textAlign || 'left');
    root.setProperty('--color-title', settings.colorTitle);
    root.setProperty('--color-artist', settings.colorArtist);
    root.setProperty('--color-progress', settings.colorProgress);
    root.setProperty('--color-accent', settings.colorAccent);
    root.setProperty('--show-cover', settings.showCover ? 'flex' : 'none');
    document.body.style.fontSize = `${settings.fontSizePx}px`;

    titleEl.style.display = settings.showTitle ? '' : 'none';
    artistEl.style.display = settings.showArtist ? '' : 'none';
    progressEl.classList.toggle('off', !settings.showProgress);
    elapsedEl.classList.toggle('off', !settings.showTimes);
    durationEl.classList.toggle('off', !settings.showTimes);

    applyPlateStyle();
  }

  /**
   * Switch the plate between its two looks.
   *
   * The classes are set here rather than in render() so a settings change takes effect
   * immediately, without waiting for the next state message.
   */
  let lastPlateStyle = null;
  function applyPlateStyle() {
    const style = settings.plateStyle === 'blur' ? 'blur' : 'cover';
    cardEl.classList.toggle('style-cover', style === 'cover');
    cardEl.classList.toggle('style-blur', style === 'blur');

    // Re-derive the colours on a style change: `cover` needs the wash, while `blur` must
    // fall back to the configured text colours to stay readable over the blurred artwork.
    if (style !== lastPlateStyle) {
      lastPlateStyle = style;
      if (style === 'cover') applyCoverColors(coverImage);
      else clearCoverColors();
    }
  }

  /* ------------------------------------------------------- colour from artwork */

  /** Relative luminance, used to decide whether text on a colour should be light or dark. */
  function luminance(r, g, b) {
    const lin = (c) => {
      const v = c / 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    };
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }

  const rgbCss = (c) => `rgb(${c[0]}, ${c[1]}, ${c[2]})`;

  /** Push a colour towards its own hue so a muted cover still gives a visible tint. */
  function saturate([r, g, b], amount) {
    const avg = (r + g + b) / 3;
    const mix = (c) => Math.max(0, Math.min(255, Math.round(avg + (c - avg) * amount)));
    return [mix(r), mix(g), mix(b)];
  }

  /**
   * The single most-used colour in the artwork.
   *
   * Pixels are quantised into coarse buckets (16 levels per channel) so near-identical
   * shades count together — otherwise a photo with slight gradients spreads across
   * thousands of buckets and no single colour wins.
   *
   * Near-black and near-white are skipped while counting, because those are usually
   * letterboxing or borders rather than the artwork's character. They are still used as a
   * fallback if every pixel is one of them.
   */
  function dominantColor(image) {
    const N = 32;
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(image, 0, 0, N, N);
    let data;
    try {
      ({ data } = ctx.getImageData(0, 0, N, N));
    } catch {
      // A tainted canvas cannot happen for a data: URL, but never break the widget over it.
      return null;
    }

    const counts = new Map();
    let fallback = null;
    let fallbackCount = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] < 128) continue;
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      const entry = counts.get(key) ?? { n: 0, r: 0, g: 0, b: 0 };
      entry.n += 1;
      entry.r += r;
      entry.g += g;
      entry.b += b;
      counts.set(key, entry);

      const lum = luminance(r, g, b);
      if (lum > 0.03 && lum < 0.94) {
        if (entry.n > fallbackCount) {
          fallbackCount = entry.n;
          fallback = [Math.round(entry.r / entry.n), Math.round(entry.g / entry.n), Math.round(entry.b / entry.n)];
        }
      }
    }
    if (fallback) {
      // Maintained incrementally above; recompute from the winning bucket for accuracy.
      let best = null;
      for (const [key, entry] of counts) {
        const lum = luminance(entry.r / entry.n, entry.g / entry.n, entry.b / entry.n);
        if (lum <= 0.03 || lum >= 0.94) continue;
        if (!best || entry.n > best.n) best = { key, ...entry };
      }
      if (best) {
        return [
          Math.round(best.r / best.n),
          Math.round(best.g / best.n),
          Math.round(best.b / best.n),
        ];
      }
      return fallback;
    }

    // Everything was black or white; take the most common bucket regardless.
    let best = null;
    for (const entry of counts.values()) if (!best || entry.n > best.n) best = entry;
    if (!best) return null;
    return [Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.b / best.n)];
  }

  /**
   * Paint the plate from the artwork.
   *
   * Only used by the `cover` style. The dominant colour becomes the wash, and the text colour
   * is then chosen for contrast against it — white on dark covers, near-black on light ones.
   * A lighter and a darker variant of the same hue give the wash some depth.
   *
   * Colours the user set explicitly (through a URL parameter) are never overridden.
   */
  function applyCoverColors(image) {
    if (!image || settings.plateStyle === 'blur') return;
    const base = dominantColor(image);
    if (!base) return;

    // Strongly saturated and held away from pure bright, so the wash reads as a definite
    // colour rather than a muddy blur of the artwork.
    const vivid = saturate(base, 1.6);
    const light = vivid.map((c) => Math.min(255, Math.round(c * 1.05 + 26)));
    const dark = vivid.map((c) => Math.round(c * 0.5));

    const root = document.documentElement.style;
    root.setProperty('--tint-light', rgbCss(light));
    root.setProperty('--tint-dark', rgbCss(dark));
    root.setProperty('--accent-derived', rgbCss(vivid));

    // Contrast: pick the text colour for the background rather than the other way round.
    const darkText = luminance(...base) > 0.55;
    if (!OVERRIDES.colorTitle) {
      root.setProperty('--color-title', darkText ? '#12121a' : '#ffffff');
    }
    if (!OVERRIDES.colorArtist) {
      root.setProperty('--color-artist', darkText ? 'rgba(18, 18, 26, 0.74)' : 'rgba(255, 255, 255, 0.80)');
    }
    if (!OVERRIDES.colorProgress) {
      root.setProperty('--color-progress', darkText ? '#12121a' : '#ffffff');
    }
    root.setProperty(
      '--text-shadow',
      darkText ? '0 1px 2px rgba(255, 255, 255, 0.4)' : '0 1px 3px rgba(0, 0, 0, 0.6)',
    );
    root.setProperty('--track-bg', darkText ? 'rgba(18, 18, 26, 0.22)' : 'rgba(255, 255, 255, 0.28)');
    root.setProperty('--divider', darkText ? 'rgba(18, 18, 26, 0.14)' : 'rgba(255, 255, 255, 0.14)');

    if (!OVERRIDES.colorAccent) root.setProperty('--color-accent', rgbCss(vivid));
  }

  /** Undo applyCoverColors, so the configured colours apply again (the `blur` style). */
  function clearCoverColors() {
    const root = document.documentElement.style;
    for (const name of ['--tint-light', '--tint-dark', '--accent-derived', '--text-shadow', '--track-bg', '--divider']) {
      root.removeProperty(name);
    }
    const fallback = {
      '--color-title': settings.colorTitle,
      '--color-artist': settings.colorArtist,
      '--color-progress': settings.colorProgress,
      '--color-accent': settings.colorAccent,
    };
    for (const [name, value] of Object.entries(fallback)) {
      // Only restore what the user did not set explicitly; their value is applied in
      // applySettings and should win.
      if (OVERRIDES[name.replace('--color-', 'color')]) continue;
      if (value) root.setProperty(name, value);
    }
  }

  function setCover(url) {
    if (url === currentCoverUrl) return;
    currentCoverUrl = url;

    if (!url) {
      coverImgEl.classList.add('empty');
      coverImgEl.removeAttribute('src');
      bgEl.style.backgroundImage = 'none';
      coverImage = null;
      // No artwork means no colour to derive, so the configured colours take over again.
      clearCoverColors();
      return;
    }

    // Preload, so the fade starts only once the new artwork is decodable.
    const img = new Image();
    img.onload = () => {
      coverImage = img;
      coverImgEl.src = url;
      coverImgEl.classList.remove('empty');
      applyCoverColors(img);

      // Cross-fade the blurred background through the spare layer.
      bgNextEl.style.backgroundImage = `url("${url}")`;
      bgNextEl.style.opacity = '1';
      setTimeout(() => {
        bgEl.style.backgroundImage = `url("${url}")`;
        bgNextEl.style.opacity = '0';
      }, 500);
    };
    img.onerror = () => {
      coverImgEl.classList.add('empty');
      coverImgEl.removeAttribute('src');
    };
    img.src = url;
  }

  function render(force = false) {
    const playing = Boolean(playback.playing);
    const idle = !track;

    // Two independent reasons to blank the plate: nothing playing, or (optionally) paused.
    // Both simply keep it transparent rather than showing an empty frame.
    const blanked = (Boolean(settings.hideWhenIdle) && idle)
      || (Boolean(settings.hideOnPause) && !playing && !idle);
    cardEl.classList.toggle('hidden', blanked);

    if (!idle) cardEl.classList.add('ready');

    // The cover is not always shown, and the text panel needs its rounded left edge back
    // when it is the only thing on the plate.
    cardEl.classList.toggle('no-cover', !settings.showCover);

    if (settings.showPausedState) {
      coverEl.classList.toggle('paused', !playing && !idle);
    } else {
      coverEl.classList.remove('paused');
    }

    if (idle) {
      layoutLabel(titleEl, titleInnerEl, 'Nothing playing');
      layoutLabel(artistEl, artistInnerEl, '');
      fillEl.style.width = '0%';
      elapsedEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      return;
    }

    layoutLabel(titleEl, titleInnerEl, track.title || 'Unknown title');
    layoutLabel(artistEl, artistInnerEl, track.artist || '');

    if (track.thumbnail !== undefined) setCover(track.thumbnail || null);

    const position = positionNow();
    const duration = Number(playback.durationMs) || Number(track.durationMs) || 0;

    // Without a timeline the bar cannot be meaningful; show it empty rather than
    // pretending the track is at 0:00 forever.
    const usable = playback.timelineAvailable !== false && duration > 0;
    if (usable) {
      const pct = Math.max(0, Math.min(100, (position / duration) * 100));
      fillEl.style.width = `${pct}%`;
      elapsedEl.textContent = formatTime(position);
      durationEl.textContent = formatTime(duration);
    } else {
      fillEl.style.width = '0%';
      elapsedEl.textContent = '0:00';
      durationEl.textContent = '--:--';
    }

    if (SHOW_DEBUG) {
      debugEl.textContent = `${track.platformName || '?'} · ${playing ? 'playing' : 'paused'} · ` +
        `${Math.round(position / 1000)}s / ${Math.round(duration / 1000)}s · ` +
        `timeline=${usable ? 'yes' : 'no'} · cover=${track.coverSource || 'none'}`;
    }
  }

  /** Advance the bar between server ticks without re-rendering the text. */
  function tickProgress() {
    if (!track) return;
    const duration = Number(playback.durationMs) || Number(track.durationMs) || 0;
    if (playback.timelineAvailable === false || duration <= 0) return;
    const position = positionNow();
    const pct = Math.max(0, Math.min(100, (position / duration) * 100));
    fillEl.style.width = `${pct}%`;
    elapsedEl.textContent = formatTime(position);
  }

  function handleState(message) {
    // Settings arrive in their own field so the lyrics overlay's contract is untouched.
    if (message.nowPlayingSettings) {
      settings = { ...settings, ...message.nowPlayingSettings, ...OVERRIDES };
      applySettings();
    }

    track = message.track ?? null;
    if (message.playback) {
      playback = {
        playing: Boolean(message.playback.playing),
        positionMs: Number(message.playback.positionMs) || 0,
        durationMs: Number(message.playback.durationMs) || 0,
        timelineAvailable: message.playback.timelineAvailable !== false,
      };
      // Re-anchor from the server's numbers so the bar cannot drift.
      anchor = { positionMs: playback.positionMs, at: performance.now(), playing: playback.playing };
    }

    render(true);
  }

  /* -------------------------------------------------------------- connection */

  let socket = null;
  let lastMessageAt = 0;
  let watchdog = null;
  let reconnectTimer = null;

  // A browser WebSocket can go silent without firing close (after sleep, or a network
  // change), which would freeze the card. The server heartbeats well inside this window.
  const SILENCE_TIMEOUT_MS = 45000;

  function connect() {
    clearTimeout(reconnectTimer);
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try {
      socket = new WebSocket(`${protocol}//${location.host}/ws?role=overlay&scope=now-playing`);
    } catch {
      reconnectTimer = setTimeout(connect, 1500);
      return;
    }

    lastMessageAt = performance.now();
    clearInterval(watchdog);
    watchdog = setInterval(() => {
      if (!socket || socket.readyState !== 1) return;
      if (performance.now() - lastMessageAt > SILENCE_TIMEOUT_MS) {
        try { socket.close(); } catch { /* already gone */ }
      }
    }, 5000);

    socket.onopen = () => { lastMessageAt = performance.now(); };
    socket.onclose = () => {
      clearInterval(watchdog);
      reconnectTimer = setTimeout(connect, 1500);
    };
    socket.onerror = () => { /* onclose follows */ };
    socket.onmessage = (event) => {
      lastMessageAt = performance.now();
      let message;
      try { message = JSON.parse(event.data); } catch { return; }
      if (message.type === 'hello') return;
      handleState(message);
    };
  }

  applySettings();
  render(true);
  // The bar is driven by a timer rather than requestAnimationFrame: Chromium suspends
  // rAF for a browser source OBS is not rendering, which would freeze the progress.
  setInterval(tickProgress, 100);
  connect();
})();
</script>
</body>
</html>
