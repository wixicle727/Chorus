name: Release

# Publishing a GitHub release is what produces the download. Tag a commit and
# push the tag, or run this workflow manually and give it a version.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Chorus has no build step and no dependencies, so the "artifact" is the source
# tree itself, archived. The archive is laid out so that unzipping it and running
# start.bat works with no further setup.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          if (-not $v) { Write-Error 'no version resolved'; exit 1 }
          "value=$v" >> $env:GITHUB_OUTPUT
          $bare = $v -replace '^v',''
          "bare=$bare" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v (package version $bare)"

      - name: Verify the tag matches package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '${{ steps.version.outputs.bare }}') {
            Write-Error "package.json says $($pkg.version) but the tag says ${{ steps.version.outputs.bare }}"
          }

      # Never ship a broken build: the same gates as CI, offline only.
      - name: Logic tests (offline)
        run: node test/run.js --offline

      - name: Engine timing tests
        run: node test/engine.js

      # The server is started and tested inside ONE step on purpose. GitHub Actions
      # reaps a step's process tree when the step ends, so a server launched in an
      # earlier step cannot be relied on to still be listening.
      - name: UI and API tests
        shell: pwsh
        run: |
          Start-Process -FilePath node -ArgumentList @('src/index.js','--no-open') -NoNewWindow
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try { Invoke-RestMethod 'http://127.0.0.1:6727/api/health' -TimeoutSec 2 | Out-Null; $up = $true; break } catch { }
          }
          if (-not $up) { Write-Error 'server did not start'; exit 1 }

          # Tee the output into the step summary so a failure is readable from the
          # run page and the API, instead of a bare "exit code 1".
          node test/ui.js 2>&1 | Tee-Object -FilePath ui-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "### UI test output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content ui-test.log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $code

      - name: Stop the server
        if: always()
        shell: pwsh
        run: Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Install build tooling
        shell: pwsh
        run: |
          # postject is the only build-time dependency (it injects the SEA blob).
          # The app itself still ships with zero runtime dependencies.
          npm ci --no-audit --no-fund

      - name: Build the standalone executable
        shell: pwsh
        run: |
          # Embeds src/ into a copy of node.exe so users install nothing.
          # web/, assets/ and tools/ are deliberately shipped as real files beside
          # it (the SMTC bridge is PowerShell and cannot be embedded).
          npm run build:exe

          if (-not (Test-Path 'build/Chorus/Chorus.exe')) {
            throw 'Chorus.exe was not produced'
          }
          Get-Item 'build/Chorus/Chorus.exe' | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # A build that cannot start is worse than no build, so run it and require the
          # API to answer before anything is published.
          #
          # The executable is a Windows GUI-subsystem binary (so it opens no console),
          # which means it has nowhere to write stdout. Its own log file is used instead.
          $exe = (Resolve-Path 'build/Chorus/Chorus.exe').Path
          $work = (Resolve-Path 'build/Chorus').Path
          $log = Join-Path $work 'smoke.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          Start-Process -FilePath $exe -ArgumentList @('--console', '--no-open', '--log-file', $log) -WorkingDirectory $work -WindowStyle Hidden

          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $health = Invoke-RestMethod 'http://127.0.0.1:6727/api/health' -TimeoutSec 2
              if ($health.name -eq 'chorus') { $up = $true; break }
            } catch { }
          }
          if (-not $up) {
            Write-Host '--- smoke log ---'
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            throw 'the executable did not answer on /api/health within 30s'
          }
          Write-Host "executable started and answered (v$($health.version))"

          # The bundled bridge must come up with it.
          $bridge = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $b = Invoke-RestMethod 'http://127.0.0.1:5000/health' -TimeoutSec 2
              if ($b.ok) { $bridge = $true; break }
            } catch { }
          }
          if (-not $bridge) { throw 'the bundled SMTC bridge did not come up on port 5000' }
          Write-Host "bundled bridge answered (v$($b.app_version))"

          Get-Process Chorus, powershell -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup's compiler ships inside the innosetup-compiler npm package, so no
          # tooling has to be pre-installed on the runner.
          npm run build:installer

          # Assert the exact filename the Publish step attaches. A mismatch is otherwise
          # silent: action-gh-release skips files it cannot find and still reports success,
          # which is how a release once shipped with only the zip.
          $expected = "build/Chorus-v${{ steps.version.outputs.bare }}-Setup.exe"
          if (-not (Test-Path $expected)) {
            Write-Host 'build/ contents:'
            Get-ChildItem build -File | Select-Object Name | Write-Host
            throw "expected the installer at $expected but it is missing"
          }
          Get-Item $expected | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Assemble the release archive
        shell: pwsh
        run: |
          # Two artifacts ship: the installer for most people, and the portable executable
          # for anyone who would rather not install anything.
          #
          # The executable is self-contained: the front-end, the images and the SMTC
          # bridge's scripts are all embedded, and the bridge is unpacked to a per-user
          # cache directory on first run.
          $stage = 'build/Chorus'
          if (-not (Test-Path "$stage/Chorus.exe")) { throw "missing $stage/Chorus.exe" }

          # Runtime data from the smoke test must never ship.
          Remove-Item "$stage/data" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$stage/.npm-cache" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$stage/smoke.log" -Force -ErrorAction SilentlyContinue

          Write-Host 'Portable release tree:'
          Get-ChildItem $stage -Force | Select-Object Name

          $zip = "build/Chorus-${{ steps.version.outputs.value }}-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host "built $zip"

          # Both artifacts must exist before publishing, because the release step skips
          # anything it cannot find without saying so.
          foreach ($artifact in @("build/Chorus-${{ steps.version.outputs.value }}-Setup.exe", $zip)) {
            if (-not (Test-Path $artifact)) { throw "missing release artifact: $artifact" }
            Get-Item $artifact | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          }

      - name: Write release notes from the changelog
        shell: pwsh
        run: |
          # Use the matching "## [x.y.z]" section of CHANGELOG.md as the body.
          $version = '${{ steps.version.outputs.bare }}'
          $lines = Get-Content CHANGELOG.md
          $body = New-Object System.Collections.Generic.List[string]
          $capturing = $false
          foreach ($line in $lines) {
            if ($line -match "^##\s+\[?$([regex]::Escape($version))\]?") { $capturing = $true; continue }
            if ($capturing -and $line -match '^##\s') { break }
            if ($capturing) { $body.Add($line) }
          }
          if ($body.Count -eq 0) { $body.Add("See CHANGELOG.md for details.") }

          $notes = @"
          Live lyrics for OBS, driven by Windows SMTC.

          ## Requirements

          - Windows 10 or 11
          - [Node.js](https://nodejs.org/) 22 or newer
          - [smtc-bridge](https://github.com/nuttylmao/smtc-bridge) running on port 5000

          ## Install

          1. Download ``Chorus-${{ steps.version.outputs.value }}.zip`` below and unzip it anywhere.
          2. Start smtc-bridge.
          3. Run ``start.bat``. A tray icon appears near the clock.
          4. In OBS add a **Browser** source pointing at ``http://127.0.0.1:6727/overlay``, size 1200x300.

          ## What's changed

          $($body -join "`n")
          "@

          Set-Content -Path build/release-notes.md -Value $notes -Encoding utf8

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Chorus ${{ steps.version.outputs.value }}
          body_path: build/release-notes.md
          # Both artifacts: the installer for most people, the portable zip for anyone
          # who would rather not install anything.
          files: |
            build/Chorus-${{ steps.version.outputs.value }}-Setup.exe
            build/Chorus-${{ steps.version.outputs.value }}-portable.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
